name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The most-guarded job: nothing else runs unless determinism holds.
  determinism-gate:
    name: Determinism gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # THE RUST FLOOR IS READ, NEVER RESTATED. `Cargo.toml`'s `[workspace.package] rust-version` is
      # the one declaration; `tools/rust-floor.sh` prints it and exits 1 (empty stdout) if it is
      # missing, and `v=$(...)` under `bash -e` fails the step on that — so an unreadable floor is a
      # red step, not an empty `toolchain:` that quietly installs whatever `stable` is today.
      # `crates/oracle-core/tests/toolchain_floor.rs` fails if any site here reverts to a literal.
      - name: Read the declared Rust floor
        id: floor
        run: |
          v=$(./tools/rust-floor.sh)
          echo "toolchain=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - name: Determinism gate + invariant proptests
        run: cargo test -p oracle-core --test determinism_gate --test proptests -- --nocapture

  build-test-lint:
    name: Build, test, clippy, fmt
    runs-on: ubuntu-latest
    needs: determinism-gate
    steps:
      - uses: actions/checkout@v4
      - name: Read the declared Rust floor
        id: floor
        run: |
          v=$(./tools/rust-floor.sh)
          echo "toolchain=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.toolchain }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # THE ONLY JOB THAT NEEDS SYSTEM LIBRARIES, and the reason CI died on 2026-08-13.
      #
      # `cargo clippy --all-targets` and `cargo test --workspace` build EVERY member, which is what
      # drags `oracle-frontend` (default features `audio` + `gamepad`) and `oracle-player` in. Two of
      # their transitive `-sys` crates hard-`unwrap()` a pkg-config probe in their build script, and
      # ubuntu-latest ships neither `.pc` file:
      #
      #   * cpal   -> alsa-sys 0.3.1   -> pkg-config `alsa`   -> libasound2-dev
      #   * gilrs  -> libudev-sys 0.1.4 -> pkg-config `libudev` -> libudev-dev
      #
      # BOTH are required. The observed failure names only `alsa-sys` because cargo aborts on the
      # first build-script panic ("build failed, waiting for other jobs to finish") — `libudev-sys`
      # was compiling in the same batch and simply never got to report. Installing one would return
      # this step to red on the other.
      #
      # The other two jobs deliberately get NOTHING: `determinism-gate` runs `-p oracle-core` and
      # `replay-playthroughs` runs `-p oracle-replay`, and `cargo tree -e normal,build` on both shows
      # a five-crate graph (oracle-core, oracle-replay, bincode, unty, virtue) with no windowing,
      # audio or gamepad edge. Both are green on today's runs, which is the empirical half of the
      # same claim. If either ever grows an `oracle-frontend`/`oracle-player` edge it will need this
      # step too.
      #
      # Exhaustive, not a guess: of the 310 packages in the workspace graph, nine carry a build
      # script that mentions pkg-config. Seven cannot fail here — `x11-dl` swallows the error
      # (`Err(_) => "None"`), `inotify-sys` probes only on netbsd/openbsd, `khronos-egl` resolves to
      # `dynamic` (not `static`), `smithay-client-toolkit` x2 resolves without `xkbcommon`, and
      # `wayland-sys` x2 resolves with `dlopen`, whose build script returns before probing. That
      # leaves exactly these two.
      - name: System libraries for the frontend/player build (alsa, udev)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      # ---------------------------------------------------------------------------------------------
      # THE VENDORED CORPORA. This step used to be `./tools/fetch-tests.sh` alone, which is the OTHER
      # half of the 46-day outage: `tools/fetch-z80-tests.sh` and `tools/fetch-testroms.sh` were never
      # run in CI at all, so five `vendor_data_present_when_running_in_ci` guards fired correctly on a
      # corpus nobody had fetched. Fixing only the clippy break would have returned CI to THAT red.
      #
      # Three corpora, three consumers:
      #   tools/fetch-tests.sh      -> vendor/ProcessorTests/68000/v1  singlestep_m68000.rs
      #   tools/fetch-z80-tests.sh  -> vendor/ProcessorTests/z80/v1    singlestep_z80.rs
      #   tools/fetch-testroms.sh   -> vendor/TestRoms                 conformance_roms.rs,
      #                                                                scanline_goldens.rs,
      #                                                                scanline_capture.rs,
      #                                                                oracle-aether/tests/scanlines.rs
      #
      # CACHED, deliberately. Uncached this is 838 sequential HTTP requests and ~726 MB per run
      # (193 MB of 68000 archives, 528 MB of z80 JSON, 5 MB of ROM zips), and — worse than the
      # minutes — it puts 17 Google Drive downloads on the critical path of every single push. Drive
      # rate-limits and serves HTML interstitials; making the check that just came back from 46 days
      # red depend on it 17 times a run is trading one outage for a flakier one.
      #
      # The stale-cache hazard is answered three ways, because a cache keyed wrong is a silent-vacuity
      # bug of exactly the kind this whole change exists to remove:
      #
      #  1. The key hashes BOTH the fetch scripts (which carry the pinned upstream commit SHAs and the
      #     file lists) and all three sha256 manifests. Any change to what is pinned, or to which files
      #     are pinned, changes the key.
      #  2. NO `restore-keys`. A prefix fallback is precisely how you restore a corpus built from a
      #     different pin — and the guards below check that named files EXIST, not what is in them, so
      #     they would not catch it. Exact key or nothing.
      #  3. `cache/restore` + `cache/save` as a PAIR rather than `actions/cache`, so the save happens
      #     *after* the fetch and the manifest verification have both passed. `actions/cache`'s post
      #     step saves even when the job failed, which would happily cache a half-finished fetch and
      #     then skip fetching forever on the exact-key hit.
      #
      # And the restore path is verified rather than trusted: `tools/verify-vendor.sh` re-checks all
      # three manifests unconditionally, on a hit and on a miss.
      - name: Restore vendored corpora
        id: vendor-cache
        uses: actions/cache/restore@v4
        with:
          path: vendor
          key: vendor-v1-${{ hashFiles('tools/fetch-tests.sh', 'tools/fetch-z80-tests.sh', 'tools/fetch-testroms.sh', 'tools/singlesteptests.sha256', 'tools/singlesteptests-z80.sha256', 'tools/testroms.sha256') }}
      - name: Fetch vendored corpora (cache miss only)
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        run: |
          ./tools/fetch-tests.sh
          ./tools/fetch-z80-tests.sh
          ./tools/fetch-testroms.sh
      # Unconditional. On a miss this re-proves what the fetch scripts just proved; on a HIT it is the
      # only thing standing between a corrupt or truncated cache entry and a green suite run over the
      # wrong bytes. It also regenerates the 68000 `.json` plaintext from the `.json.gz` archives the
      # manifest actually pins, closing the one derivation step no manifest covered.
      - name: Verify vendored corpora against their pinned manifests
        run: ./tools/verify-vendor.sh
      - name: Save vendored corpora
        if: steps.vendor-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor
          key: ${{ steps.vendor-cache.outputs.cache-primary-key }}
      # Named FIRST and with --nocapture, because libtest swallows a passing test's stdout: without
      # this step the frozen-pin banner would exist and never be seen on a green run, which is exactly
      # the failure it was written to prevent. 0.06 s, and it makes the log say which aeon chain
      # everything below was tested against.
      - name: Name the frozen aeon pin
        run: cargo test -p oracle-replay --test aeon_pin -- --nocapture
      # Same reasoning as the aeon pin above, one level stricter. `cargo test --workspace` below RUNS the
      # six `vendor_data_present_when_running_in_ci` guards, but it cannot SHOW them: libtest prints
      # `test vendor_data_present_when_running_in_ci ... ok` identically whether a guard verified 708
      # files or returned on its first line, and under capture a passing test prints nothing at all. A
      # green run whose guards silently no-opped is the exact defect this whole change removes, so the
      # log has to name them. The script runs the six by filter with --nocapture and requires six
      # `CORPUS GUARD ...: OK` banners — because a libtest filter that matches nothing exits 0.
      - name: Corpus guards (name them in the log)
        run: ./tools/ci-corpus-guards.sh

      # ⚑ EXPECT THIS STEP TO GET MATERIALLY LONGER, and that it is the fix working rather than a
      # regression. Measured baseline from the last green run before the outage (id 29964362524,
      # 2026-07-22): `Fetch` 65 s, `Test` 23 m 33 s — and that ran the 68000 sweep ALONE, because the
      # other two corpora were never fetched. This step now additionally runs the z80 SST sweep
      # (708 files x 1000 cases), the 17-ROM conformance scorecard and the scanline goldens, none of
      # which has ever executed on a runner. `tools/land.sh` runs the same suite locally in ~25 min,
      # but in RELEASE (G7) whereas this is debug, so debug is the unmeasured direction.
      #
      # No `timeout-minutes` is set here deliberately: GitHub's 360-minute default will not be
      # reached, and a tighter bound picked before anyone has seen the real number would be a red
      # invented rather than measured. Set one once the first green run says what the number is.
      - name: Test
        run: cargo test --workspace

  # The replay net's three full playthroughs. THIS IS THE RUNNER THAT EXECUTES THEM.
  #
  # They are ~183 s of emulation unoptimized and ~24 s optimized, so they are skipped in the debug
  # suite above (`#[cfg_attr(debug_assertions, ignore)]`) and run here, in release. They used to be a
  # plain `#[ignore]` behind a `--ignored` flag nobody types — which is how the fixture pin they read
  # was allowed to go stale while the suite stayed green.
  #
  # Its own job, not appended to `Test`, so a red here says "the replay net desynced" rather than
  # hiding inside a workspace run, and so the debug suite's runtime is untouched.
  replay-playthroughs:
    name: Replay playthroughs (release)
    runs-on: ubuntu-latest
    needs: determinism-gate
    steps:
      - uses: actions/checkout@v4
      - name: Read the declared Rust floor
        id: floor
        run: |
          v=$(./tools/rust-floor.sh)
          echo "toolchain=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.floor.outputs.toolchain }}
      - uses: Swatinem/rust-cache@v2
      # Runs the same script a developer runs locally, so there is one code path and no drift between
      # "what CI runs" and "what I ran". The pin-currency report it prints at the end is REPORT ONLY
      # and cannot change the exit status; on CI there is no sibling sigil checkout, so it correctly
      # prints UNMEASURABLE rather than an unearned all-clear.
      - name: Full replay playthroughs against the frozen pin
        run: ./tools/replay_playthroughs.sh
