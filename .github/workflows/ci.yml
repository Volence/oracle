name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The most-guarded job: nothing else runs unless determinism holds.
  determinism-gate:
    name: Determinism gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      - name: Determinism gate + invariant proptests
        run: cargo test -p oracle-core --test determinism_gate --test proptests -- --nocapture

  build-test-lint:
    name: Build, test, clippy, fmt
    runs-on: ubuntu-latest
    needs: determinism-gate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # THE ONLY JOB THAT NEEDS SYSTEM LIBRARIES, and the reason CI died on 2026-08-13.
      #
      # `cargo clippy --all-targets` and `cargo test --workspace` build EVERY member, which is what
      # drags `oracle-frontend` (default features `audio` + `gamepad`) and `oracle-player` in. Two of
      # their transitive `-sys` crates hard-`unwrap()` a pkg-config probe in their build script, and
      # ubuntu-latest ships neither `.pc` file:
      #
      #   * cpal   -> alsa-sys 0.3.1   -> pkg-config `alsa`   -> libasound2-dev
      #   * gilrs  -> libudev-sys 0.1.4 -> pkg-config `libudev` -> libudev-dev
      #
      # BOTH are required. The observed failure names only `alsa-sys` because cargo aborts on the
      # first build-script panic ("build failed, waiting for other jobs to finish") — `libudev-sys`
      # was compiling in the same batch and simply never got to report. Installing one would return
      # this step to red on the other.
      #
      # The other two jobs deliberately get NOTHING: `determinism-gate` runs `-p oracle-core` and
      # `replay-playthroughs` runs `-p oracle-replay`, and `cargo tree -e normal,build` on both shows
      # a five-crate graph (oracle-core, oracle-replay, bincode, unty, virtue) with no windowing,
      # audio or gamepad edge. Both are green on today's runs, which is the empirical half of the
      # same claim. If either ever grows an `oracle-frontend`/`oracle-player` edge it will need this
      # step too.
      #
      # Exhaustive, not a guess: of the 310 packages in the workspace graph, nine carry a build
      # script that mentions pkg-config. Seven cannot fail here — `x11-dl` swallows the error
      # (`Err(_) => "None"`), `inotify-sys` probes only on netbsd/openbsd, `khronos-egl` resolves to
      # `dynamic` (not `static`), `smithay-client-toolkit` x2 resolves without `xkbcommon`, and
      # `wayland-sys` x2 resolves with `dlopen`, whose build script returns before probing. That
      # leaves exactly these two.
      - name: System libraries for the frontend/player build (alsa, udev)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      # Fetch the pinned SingleStepTests vendor data so the SST suite actually runs (a missing dir
      # would make every per-file test skip and the suite pass vacuously — the `vendor_data_present_
      # when_running_in_ci` guard test turns that into a hard failure under CI).
      - name: Fetch SingleStepTests vendor data
        run: ./tools/fetch-tests.sh
      # Named FIRST and with --nocapture, because libtest swallows a passing test's stdout: without
      # this step the frozen-pin banner would exist and never be seen on a green run, which is exactly
      # the failure it was written to prevent. 0.06 s, and it makes the log say which aeon chain
      # everything below was tested against.
      - name: Name the frozen aeon pin
        run: cargo test -p oracle-replay --test aeon_pin -- --nocapture

      - name: Test
        run: cargo test --workspace

  # The replay net's three full playthroughs. THIS IS THE RUNNER THAT EXECUTES THEM.
  #
  # They are ~183 s of emulation unoptimized and ~24 s optimized, so they are skipped in the debug
  # suite above (`#[cfg_attr(debug_assertions, ignore)]`) and run here, in release. They used to be a
  # plain `#[ignore]` behind a `--ignored` flag nobody types — which is how the fixture pin they read
  # was allowed to go stale while the suite stayed green.
  #
  # Its own job, not appended to `Test`, so a red here says "the replay net desynced" rather than
  # hiding inside a workspace run, and so the debug suite's runtime is untouched.
  replay-playthroughs:
    name: Replay playthroughs (release)
    runs-on: ubuntu-latest
    needs: determinism-gate
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - uses: Swatinem/rust-cache@v2
      # Runs the same script a developer runs locally, so there is one code path and no drift between
      # "what CI runs" and "what I ran". The pin-currency report it prints at the end is REPORT ONLY
      # and cannot change the exit status; on CI there is no sibling sigil checkout, so it correctly
      # prints UNMEASURABLE rather than an unearned all-clear.
      - name: Full replay playthroughs against the frozen pin
        run: ./tools/replay_playthroughs.sh
