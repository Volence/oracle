[package]
name = "oracle-aether"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Aether control surface for oracle-core — JSON-RPC 2.0 over NDJSON on an AF_UNIX socket, per empyrean/contract/protocol.md."

# The socket server deliberately lives OUTSIDE `oracle-core`, whose charter is "deterministic, no-I/O"
# (`crates/oracle-core/src/lib.rs`) and whose dependency list is one crate (`bincode`). Threads, sockets
# and JSON all live here; the core keeps its dependency set unchanged. Verify with
# `cargo tree -p oracle-core`.
[dependencies]
oracle-core = { path = "../oracle-core" }
serde_json = "1"

# TEST-ONLY. Contract §8 item 15 / D14: `schema/bus-protocol.schema.json` is normative for wire shapes,
# and "a server's own tests SHOULD assert real messages against it rather than against a reading of this
# prose". A real validator, not a hand-rolled one — a hand-rolled checker of a normative artifact is a
# second reading of it, which is the failure the item exists to prevent.
#
# It stays a DEV-dependency: this crate's runtime deps are `oracle-core` + `serde_json` and must not grow
# (see the note above `[dependencies]`). `default-features = false` drops the HTTP/file `$ref` resolvers
# and their TLS stack — the schema is self-contained, every `$ref` is a local `#/$defs/...`.
[dev-dependencies]
jsonschema = { version = "0.49", default-features = false }

[[bin]]
name = "oracle-aether"
path = "src/main.rs"
