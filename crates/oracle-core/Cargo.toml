[package]
name = "oracle-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Deterministic, no-I/O Sega Genesis / Mega Drive emulation core for the Oracle debugging engine."

[features]
# Native, opt-in sound synthesis (Phase SY). Default OFF: keeps the synth module (and any future
# vendored FM core) out of the default build the currency gates compile. Currency-neutrality itself comes
# from the caller-owned sink seam, not the feature — this is belt-and-suspenders isolation.
synth = []

[dependencies]
bincode = { version = "2", features = ["derive"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"

# motion_run and ab_compare carry unit tests (pad-script parsing / per-port union; PPM parse + ramp
# normalization + offset diff); tests in an example target are only run by `cargo test` when the target opts
# in. All other examples stay auto-discovered (autoexamples defaults to true — declaring a target explicitly
# does not turn discovery off).
[[example]]
name = "motion_run"
test = true

[[example]]
name = "ab_compare"
test = true

# The synth WAV example references the feature-gated `synth` module, so it must not be part of the default
# build the currency gates compile. `required-features` makes it compile only under `--features synth`.
[[example]]
name = "synth_render"
required-features = ["synth"]
