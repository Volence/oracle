[package]
name = "oracle-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Deterministic, no-I/O Sega Genesis / Mega Drive emulation core for the Oracle debugging engine."

[dependencies]
bincode = { version = "2", features = ["derive"] }

[dev-dependencies]
proptest = "1"
serde_json = "1"

# motion_run and ab_compare carry unit tests (pad-script parsing / per-port union; PPM parse + ramp
# normalization + offset diff); tests in an example target are only run by `cargo test` when the target opts
# in. All other examples stay auto-discovered (autoexamples defaults to true — declaring a target explicitly
# does not turn discovery off).
[[example]]
name = "motion_run"
test = true

[[example]]
name = "ab_compare"
test = true
