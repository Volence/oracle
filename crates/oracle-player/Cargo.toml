[package]
name = "oracle-player"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The toolkit player: the Oracle emulator hosted in a dockable egui/egui_dock UI. Parcel 1 = the shell, the pacing and the input; the debug panels land in later parcels."

[dependencies]
# The emulation core, with the native synth on — the audio device is the master clock here, so the synth is
# not optional the way it is in `oracle-frontend`.
oracle-core = { path = "../oracle-core", features = ["synth"] }

# The toolkit. These must NEVER appear in `oracle-core` or `oracle-frontend`; being a *member* of this
# workspace does not put them there (a member's dependencies are its own), and `cargo tree -p oracle-core`
# / `-p oracle-frontend` are gated on that in the design doc's reproduction section.
eframe = "0.36"
egui = "0.36"
egui_dock = "0.21"

# The SAME audio substrate `oracle-frontend` uses. `src/audio.rs` here is `#[path]`-included from
# `crates/oracle-frontend/src/audio.rs`, byte for byte, so this crate needs exactly its two dependencies at
# exactly the player's versions. See `src/audio.rs` for why it is included rather than depended on.
ringbuf = "0.4"
cpal = "0.15"

# TEST-ONLY, and deliberately so for parcel 2a. `ui.rs`'s `mod bus_parity` compares what the Registers
# panel derives against what `Engine::registers` answers through `Host::call`, so the test needs to see
# both sides; `oracle-frontend` does the same thing in `pick.rs` and takes `serde_json` dev-only for it.
#
# **Why dev and not a real dependency.** Nothing on the *shipped* path reaches `oracle-aether` in this
# parcel: the panel reads `Machine::cpu_regs()` / `Machine::system()` directly (design §4.4's route (a) —
# anything repainting at 60 Hz reads a shared derivation, it does not dispatch). Keeping the link in
# `[dev-dependencies]` therefore leaves the binary's dependency graph byte-identical to parcel 1's, which
# is the measurable answer to §8 item 7 rather than an assurance about it — `cargo tree -p oracle-player`
# without `--all-targets` shows no `oracle-aether`.
#
# Parcels 2b/2c change this: the Objects panel calls `oracle_aether::decoders` on the repaint path, and
# the transport bar calls `Host::call` per gesture. Both need a real dependency, and promoting one line is
# cheaper than shipping an unused link now for a parcel that does not use it.
#
# `oracle-aether` is `#![cfg(unix)]`, so the test module that uses it is `#[cfg(unix)]` too.
[dev-dependencies]
oracle-aether = { path = "../oracle-aether" }
serde_json = "1"
