[package]
name = "oracle-player"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "The toolkit player: the Oracle emulator hosted in a dockable egui/egui_dock UI. Parcel 1 = the shell, the pacing and the input; the debug panels land in later parcels."

[dependencies]
# The emulation core, with the native synth on — the audio device is the master clock here, so the synth is
# not optional the way it is in `oracle-frontend`.
oracle-core = { path = "../oracle-core", features = ["synth"] }

# The toolkit. These must NEVER appear in `oracle-core` or `oracle-frontend`; being a *member* of this
# workspace does not put them there (a member's dependencies are its own), and `cargo tree -p oracle-core`
# / `-p oracle-frontend` are gated on that in the design doc's reproduction section. The two features below
# are **layout persistence** (`src/layout.rs`, design §6), and the cost is exactly the one §9.2 quotes:
#
# * `eframe/persistence` is NOT an eframe default — it is `["egui-winit/serde", "egui/persistence", "ron",
#   "serde"]`, so it brings `ron` into this crate's graph (and into `Cargo.lock`, which had none). It is
#   what makes `App::save` get called and `CreationContext::storage` be `Some`, and it is also what gets
#   the window's own geometry remembered rather than only the dock.
# * `egui_dock/serde` is `["dep:serde", "egui/serde"]` and is what derives `Serialize`/`Deserialize` on
#   `DockState<Tab>` (`egui_dock-0.21.1/src/dock_state/mod.rs:44`, with `translations` skipped).
#
# Neither touches `oracle-core`/`oracle-frontend`: `cargo tree -p oracle-core | grep -icE
# 'egui|eframe|wgpu|winit'` is still 0, and so is `-p oracle-frontend`.
eframe = { version = "0.36", features = ["persistence"] }
egui = "0.36"
egui_dock = { version = "0.21", features = ["serde"] }

# The SAME audio substrate `oracle-frontend` uses. `src/audio.rs` here is `#[path]`-included from
# `crates/oracle-frontend/src/audio.rs`, byte for byte, so this crate needs exactly its two dependencies at
# exactly the player's versions. See `src/audio.rs` for why it is included rather than depended on.
ringbuf = "0.4"
cpal = "0.15"

# **Promoted from `[dev-dependencies]` by parcel 2b**, which is when it stopped being a test-only link.
# Parcel 2a kept it dev-only because nothing on the shipped path reached the bus: the Registers panel
# reads `Machine::cpu_regs()` directly (design §4.4's route (a) — anything repainting at 60 Hz reads a
# shared derivation, it does not dispatch), and only `ui.rs`'s `mod bus_parity` needed to see both sides.
#
# The running player now **owns a `Host`**. The Memory panel's writes, its address box's symbol
# resolution and its `memory_hash` button are per-gesture commands and go through `Host::call`, so they
# get the tool's own reply, the tool's own refusal and the tool's own error text rather than a sentence
# this crate composed about a server it lives inside. Its *reads* still go direct — through
# `oracle_aether::engine`'s free `debug_read` / `vdp_space_read` / `z80_read_window`, which are the same
# functions the five read handlers call.
#
# Nothing here serves: no socket is bound, no thread is started (`Host::new`'s own guarantee), and
# `Host::pump` is never called inside a frame. The one drain is at setup, for the pause mirror.
#
# `oracle-aether` is `#![cfg(unix)]`, and so is this whole crate in practice — it is a Unix player.
oracle-aether = { path = "../oracle-aether" }

# The wire vocabulary. `Host::call` takes and returns `serde_json::Value`, so every panel that invokes a
# command speaks it; it was dev-only for parcel 2a for the same reason `oracle-aether` was.
serde_json = "1"

# **Direct as of the layout-persistence parcel**, for one `#[derive]` on `ui::Tab` — a saved `DockState`
# stores the tab values themselves, so the enum has to be (de)serializable for `egui_dock/serde` to mean
# anything. `serde` was already in the graph transitively (via `serde_json`, `egui` and `eframe`); the
# `derive` feature and the direct edge are what is new. The saved layout is **RON, not JSON**: a node that
# has not been laid out yet holds `Rect::NOTHING`, i.e. `±f32::INFINITY`, which `serde_json` writes as
# `null` and then refuses to read back as an `f32`. See `src/layout.rs`'s header and its
# `the_default_layout_holds_non_finite_rects_which_is_why_this_is_ron` test.
serde = { version = "1", features = ["derive"] }
