[package]
name = "oracle-frontend"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Live windowed frontend for the oracle-core Genesis emulation core — window + keyboard + gamepad, no I/O in the core."

[dependencies]
oracle-core = { path = "../oracle-core" }
minifb = "0.28"
# Window identity (icon + WM class) — both already in the tree as minifb's own dependencies, promoted to
# direct so `icon.rs` can match on the raw window handle and call `XSetClassHint` on minifb's Display. No new
# crate enters the lock file.
raw-window-handle = "0.6"
x11-dl = "2.21"
# Real-time audio (Phase SY-5) — frontend-only; pulls the core's opt-in synth, an SPSC ring, and the
# host output stream. All three are optional and confined to the frontend `audio` feature.
ringbuf = { version = "0.4", optional = true }
cpal = { version = "0.15", optional = true }
# Host gamepad input — frontend-only, pure-Rust (no SDL). Optional and confined to the `gamepad` feature; it
# must never reach oracle-core, whose dependency list is deliberately tiny and I/O-free.
gilrs = { version = "0.11", optional = true }
# The Aether capability layer, hosted in this process (`--aether`). Optional because it is `#![cfg(unix)]`
# and because the player must be buildable without a control surface at all; the `bus`/`bus_stub` pair keeps
# the run loop identical either way.
oracle-aether = { path = "../oracle-aether", optional = true }

[dev-dependencies]
# TEST-ONLY, and only reached under the `aether` feature: `pick.rs`'s bus-parity tests read the JSON the
# Aether handler returns, so they need to index a `Value`. It is not a runtime dependency of the player —
# the frontend links serde_json only via the optional `oracle-aether`, and a `--no-default-features`
# build has neither.
serde_json = "1"

[features]
default = ["audio", "gamepad", "aether"]
# Turns on the core's native synth (AudioSink), the SPSC-ring substrate, and the cpal host output stream.
audio = ["dep:ringbuf", "dep:cpal", "oracle-core/synth"]
# Turns on host gamepad polling (gilrs). Off → keyboard-only, exactly as before this feature existed.
gamepad = ["dep:gilrs"]
# Hosts the Aether capability layer in this process. Serving is still opt-in at *runtime* (`--aether`); this
# only decides whether the binary is capable of it.
aether = ["dep:oracle-aether"]
