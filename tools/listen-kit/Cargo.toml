[package]
name = "listen-kit"
version = "0.0.0"
edition = "2021"
rust-version = "1.96.0"
publish = false
description = "The d-51 listening kit's headless renderer and WAV differ: renders one ROM stretch to WAV with the Z80 /INT census on, so a before build and an after build can be compared sample by sample. Not a workspace member; see docs/2026-09-25-d51-listen-kit.md."

# Its OWN workspace root, like crates/oracle-panels-spike: a worktree under oracle/.claude/worktrees/ would
# otherwise find the parent checkout's manifest. Not a member of the repo workspace, so the landing gates never
# build it and `oracle-core`'s `z80-census` feature is switched on only here.
[workspace]

[dependencies]
oracle-core = { path = "../../crates/oracle-core", features = ["synth", "z80-census"] }
oracle-replay = { path = "../../crates/oracle-replay" }
